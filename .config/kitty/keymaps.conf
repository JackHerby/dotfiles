# Open Kitty config remap.
map kitty_mod+f2 launch --type=tab --tab-title="Kitty config" --cwd=~/.config/kitty nvim kitty.conf
# Open Neovim config.
map kitty_mod+f4 launch --type=tab --tab-title="Neovim config" --cwd=~/.config/nvim nvim init.lua

map f2 launch
\ --cwd=~
\ --type=window-dock
\ --dock-edge=bottom
\ --dock-size=50%
\ --var=dock=fzf
\ fzf
\ --bind "enter:execute(nvim {})"
\ --preview 'batcat --style=numbers --color=always {}'
\ --preview-border=sharp
map f3 new_tab
map f4 set_tab_title

map f5 launch --location=split
map f6 set_window_title
map f7 layout_action bias 50 66 75
map f8 detach_window ask

map f9 kitten toggle_padding.py
map f10 kitten toggle_opacity.py
map --allow-fallback=shifted,ascii f11 set_background_opacity -0.1
map --allow-fallback=shifted,ascii f12 set_background_opacity +0.1

map kitty_mod+d remote_control focus-window --match var:dock=fzf
map kitty_mod+s goto_session ~/.config/kitty/sessions/
