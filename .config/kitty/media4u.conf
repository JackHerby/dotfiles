os_window_state maximized
new_tab PLG www
cd ~/Projects/pl/bonprix-www/ssr/
launch --bias=65 --hold --title 'Server side rendering Neovim' --var window=plg_www_dev nvim
cd ~/Projects/pl/bonprix-www/
launch
focus_matching_window var:window=plg_www_dev

new_tab PLG cms
cd ~/Projects/pl/bonprix-cms/cms/
launch --bias=65 --hold --title 'CMS Neovim' --var window=plg_cms_dev nvim
cd ~/Projects/pl/bonprix-cms/
launch
focus_matching_window var:window=plg_cms_dev

new_tab FRG www
cd ~/Projects/fr/bonprix-www/ssr/
launch --bias=65 --hold --title 'Server side rendering Neovim' --var window=frg_www_dev nvim
cd ~/Projects/fr/bonprix-www/
launch
focus_matching_window var:window=frg_www_dev

new_tab FRG cms
cd ~/Projects/fr/cms/cms/
launch --bias=65 --hold --title 'CMS Neovim' --var window=frg_cms_dev nvim
cd ~/Projects/fr/cms/
launch
focus_matching_window var:window=frg_cms_dev

new_tab Misc
cd ~
launch --bias=65 --var window=misc_dev
launch --hold neofetch
focus_matching_window var:window=misc_dev

new_os_window
os_window_state maximized

new_tab PLG connection
layout fat:mirrored=true
cd ~/Projects/pl/bonprix-www/tools/
launch

new_tab PLG www development
layout fat:mirrored=true
cd ~/Projects/pl/bonprix-www/tools/
launch

new_tab PLG cms development
layout fat:mirrored=true
cd ~/Projects/pl/bonprix-cms/tools/
launch

new_tab FRG www development
layout fat:mirrored=true
cd ~/Projects/fr/bonprix-www/tools/
launch

new_tab FRG cms development
layout fat:mirrored=true
cd ~/Projects/fr/cms/tools/
launch

new_tab Btop
cd ~
launch --hold btop
