[[mgr.prepend_keymap]]
on   = [ "g", "d" ]
run  = "cd ~/Documents/notes"
desc = "Cd to Documents/notes"

[[mgr.prepend_keymap]]
on   = [ "g", "k" ]
run  = "cd ~/.config/kitty"
desc = "Cd to Kitty config"

[[mgr.prepend_keymap]]
on   = [ "g", "n" ]
run  = "cd ~/.config/nvim"
desc = "Cd to Neovim config"

[[mgr.prepend_keymap]]
on   = [ "g", "p" ]
run  = "cd ~/Projects"
desc = "Cd to Projects"

[[mgr.prepend_keymap]]
on = [ "g", "r" ]
run = 'shell -- ya emit cd "$(git rev-parse --show-toplevel)"'
desc = "Go to Git root"

[[mgr.prepend_keymap]]
on   = [ "g", "y" ]
run  = "cd ~/.config/yazi"
desc = "Cd to Yazi config"
